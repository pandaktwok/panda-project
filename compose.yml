# Panda Project - instalação com um comando
#
#   1) cp .env.example .env      e preencha (senhas, endereço, chaves)
#   2) docker compose up -d --build
#   3) abra o endereço de KANEO_CLIENT_URL (padrão http://localhost:5173)
#
# Sobe: PostgreSQL, armazenamento de arquivos (S3) e o sistema (API + web).
# Dados ficam nos volumes postgres_data e storage_data: veja docs/BACKUP.md.
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaneo}
      POSTGRES_DB: ${POSTGRES_DB:-kaneo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  # Armazenamento de arquivos compatível com S3 (SeaweedFS, imagem do Docker Hub).
  # O bucket é criado pelo próprio sistema na primeira subida.
  storage:
    image: chrislusf/seaweedfs:3.99
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"panda","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=100 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Defina S3_ACCESS_KEY_ID no arquivo .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Defina S3_SECRET_ACCESS_KEY no arquivo .env (8 caracteres ou mais)}
    volumes:
      - storage_data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped

  kaneo:
    build:
      context: .
      dockerfile: Dockerfile.kaneo
    image: panda-project:local
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      # Sem esta chave, salvar segredo de webhook falha. Veja .env.example.
      NOTIFICATION_SECRET_ENCRYPTION_KEY: ${NOTIFICATION_SECRET_ENCRYPTION_KEY:?Defina NOTIFICATION_SECRET_ENCRYPTION_KEY no arquivo .env (openssl rand -hex 32)}
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no arquivo .env (openssl rand -hex 32)}
    # Permite usar host.docker.internal como endereço do armazenamento também no Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

#  Opcional, só para vários servidores da API (alta disponibilidade)
#  redis:
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

volumes:
  postgres_data:
  storage_data:
