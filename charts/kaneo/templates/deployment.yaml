{{- $corsOrigins := .Values.kaneo.env.corsOrigins -}}
{{- $corsOriginsValue := "" -}}
{{- if kindIs "slice" $corsOrigins -}}
  {{- $corsOriginsValue = join "," $corsOrigins -}}
{{- else if $corsOrigins -}}
  {{- $corsOriginsValue = $corsOrigins -}}
{{- else if .Values.kaneo.env.clientUrl -}}
  {{- $corsOriginsValue = .Values.kaneo.env.clientUrl | trim | trimSuffix "/" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaneo.fullname" . }}
  labels:
    {{- include "kaneo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kaneo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kaneo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kaneo
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kaneo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      enableServiceLinks: {{ default false .Values.enableServiceLinks }}
      containers:
        - name: kaneo
          securityContext:
            {{- toYaml .Values.kaneo.securityContext | nindent 12 }}
          image: "{{ .Values.kaneo.image.repository }}:{{ .Values.kaneo.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.kaneo.image.pullPolicy }}
          ports:
            - name: kaneo
              containerPort: {{ .Values.kaneo.service.targetPort }}
              protocol: TCP
          env:
            - name: KANEO_CLIENT_URL
              value: {{ .Values.kaneo.env.clientUrl | trim | trimSuffix "/" | quote }}
            - name: CORS_ORIGINS
              value: {{ $corsOriginsValue | quote }}
            - name: AUTH_SECRET
              {{- if .Values.kaneo.env.existingSecret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kaneo.env.existingSecret.name }}
                  key: {{ .Values.kaneo.env.existingSecret.key }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "kaneo.fullname" . }}-auth
                  key: auth-secret
              {{- end }}
            {{- if and (not .Values.kaneo.env.database.external.enabled) .Values.postgresql.auth.existingSecret }}
            - name: KANEO_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey }}
            {{- end }}
            - name: DATABASE_URL
              {{- if .Values.kaneo.env.database.external.enabled }}
              {{- if .Values.kaneo.env.database.external.existingSecret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kaneo.env.database.external.existingSecret.name }}
                  key: {{ .Values.kaneo.env.database.external.existingSecret.passwordKey }}
              {{- else }}
              value: "postgresql://{{ include "kaneo.urlencodeUserinfo" .Values.kaneo.env.database.external.username }}:{{ include "kaneo.urlencodeUserinfo" .Values.kaneo.env.database.external.password }}@{{ .Values.kaneo.env.database.external.host }}:{{ .Values.kaneo.env.database.external.port }}/{{ .Values.kaneo.env.database.external.database }}"
              {{- end }}
              {{- else }}
              {{- if .Values.postgresql.auth.existingSecret }}
              value: "postgresql://{{ include "kaneo.urlencodeUserinfo" .Values.postgresql.auth.username }}:$(KANEO_POSTGRES_PASSWORD)@{{ include "kaneo.fullname" . }}-postgresql:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}"
              {{- else }}
              value: "postgresql://{{ include "kaneo.urlencodeUserinfo" .Values.postgresql.auth.username }}:{{ include "kaneo.urlencodeUserinfo" .Values.postgresql.auth.password }}@{{ include "kaneo.fullname" . }}-postgresql:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}"
              {{- end }}
              {{- end }}
            - name: NOTIFICATION_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.kaneo.env.notificationSecretExistingSecret.enabled }}
                  name: {{ .Values.kaneo.env.notificationSecretExistingSecret.name }}
                  key: {{ .Values.kaneo.env.notificationSecretExistingSecret.key }}
                  {{- else }}
                  name: {{ include "kaneo.fullname" . }}-notification
                  key: notification-encryption-key
                  {{- end }}
            - name: S3_ENDPOINT
              value: {{ .Values.kaneo.env.s3.endpoint | trim | trimSuffix "/" | quote }}
            - name: S3_BUCKET
              value: {{ .Values.kaneo.env.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.kaneo.env.s3.region | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.kaneo.env.s3.forcePathStyle | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  {{- if .Values.minio.enabled }}
                  name: {{ default (printf "%s-minio" (include "kaneo.fullname" .)) .Values.minio.auth.existingSecret }}
                  key: {{ .Values.minio.auth.secretKeys.rootUserKey }}
                  {{- else if .Values.kaneo.env.s3.existingSecret.enabled }}
                  name: {{ .Values.kaneo.env.s3.existingSecret.name }}
                  key: {{ .Values.kaneo.env.s3.existingSecret.accessKeyIdKey }}
                  {{- else }}
                  name: {{ include "kaneo.fullname" . }}-s3
                  key: access-key-id
                  {{- end }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.minio.enabled }}
                  name: {{ default (printf "%s-minio" (include "kaneo.fullname" .)) .Values.minio.auth.existingSecret }}
                  key: {{ .Values.minio.auth.secretKeys.rootPasswordKey }}
                  {{- else if .Values.kaneo.env.s3.existingSecret.enabled }}
                  name: {{ .Values.kaneo.env.s3.existingSecret.name }}
                  key: {{ .Values.kaneo.env.s3.existingSecret.secretAccessKeyKey }}
                  {{- else }}
                  name: {{ include "kaneo.fullname" . }}-s3
                  key: secret-access-key
                  {{- end }}
            - name: DISABLE_REGISTRATION
              value: {{ .Values.kaneo.env.disableRegistration | quote }}
            - name: DISABLE_PASSWORD_REGISTRATION
              value: {{ .Values.kaneo.env.disablePasswordRegistration | quote }}
            - name: DISABLE_EMAIL_OTP_SIGN_IN
              value: {{ .Values.kaneo.env.disableEmailOtpSignIn | quote }}
            {{- with .Values.kaneo.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.kaneo.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.kaneo.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.kaneo.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.kaneo.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
